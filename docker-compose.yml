services:
  cf-failover:
    build: .
    image: cf-failover:latest
    container_name: cf-failover
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOMAIN: "octopus-review.ai"
      DRY_RUN: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
